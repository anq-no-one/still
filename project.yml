name: Still
options:
  bundleIdPrefix: com.andrii
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: 87a39dfe4068fef0f1c69bfe704b2b3ef4fbc5bc
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: "R3XFQ7K885"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Still-iOS:
    type: application
    platform: iOS
    dependencies:
      - package: FluidAudio
    sources:
      - path: Still
    info:
      path: Still/Supporting/iOS-Info.plist
      properties:
        CFBundleDisplayName: Still
        NSMicrophoneUsageDescription: Still uses the microphone to transcribe a meeting on this device.
        NSLocalNetworkUsageDescription: Still syncs directly with your other devices on this network when you turn on nearby sync.
        NSCalendarsFullAccessUsageDescription: Still reads the event you are in to suggest a title and the people expected.
        NSBonjourServices:
          - _still-sync._tcp
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Still
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still
        CODE_SIGN_ENTITLEMENTS: Still/Still.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "*.fixture.caf"
    entitlements:
      path: Still/Still.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.andrii.still
  Still-macOS:
    type: application
    platform: macOS
    dependencies:
      - target: StillBrowserExtension
        embed: true
      - package: FluidAudio
    sources:
      - path: Still
    settings:
      base:
        PRODUCT_NAME: Still
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Still
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Still uses the microphone to transcribe a meeting on this device.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Still syncs directly with your other devices on this network when you turn on nearby sync.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Still reads the event you are in to suggest a title and the people expected.
        CODE_SIGN_ENTITLEMENTS: Still/Still.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "*.fixture.caf"
    entitlements:
      path: Still/Still.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.andrii.still
  StillBrowserExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: StillBrowserExtension
    info:
      path: StillBrowserExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.browser
        PRODUCT_NAME: StillBrowserExtension
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: StillBrowserExtension/StillBrowserExtension.entitlements
    entitlements:
      path: StillBrowserExtension/StillBrowserExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
  StillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StillUITests
    dependencies:
      - target: Still-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Still-iOS
        CODE_SIGN_STYLE: Automatic
  StillTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StillTests
    dependencies:
      - target: Still-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Still.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Still"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Still-iOS:
    build:
      targets:
        Still-iOS: all
        StillUITests: [test]
    run:
      storeKitConfiguration: Still/Supporting/Still.storekit
    test:
      targets:
        - StillUITests
  Still-macOS:
    build:
      targets:
        Still-macOS: all
        StillTests: [test]
    run:
      storeKitConfiguration: Still/Supporting/Still.storekit
    test:
      targets:
        - StillTests
