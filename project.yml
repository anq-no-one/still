name: Still
options:
  bundleIdPrefix: com.andrii
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    revision: 87a39dfe4068fef0f1c69bfe704b2b3ef4fbc5bc
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: ee673d6a71d76e67b532dc7eaf91d92edc3bb8bb
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    revision: c21fdcde390313a6d98d8e33a346f2c3486c3ab0
settings:
  base:
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: "R3XFQ7K885"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Still-iOS:
    type: application
    platform: iOS
    dependencies:
      - package: FluidAudio
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: SwiftTransformers
        product: Tokenizers
    sources:
      - path: Still
        excludes:
          - MCP/**
          - Still-macOS.entitlements
    info:
      path: Still/Supporting/iOS-Info.plist
      properties:
        CFBundleDisplayName: Still
        NSMicrophoneUsageDescription: Still uses the microphone to transcribe a meeting on this device.
        NSLocalNetworkUsageDescription: Still syncs directly with your other devices on this network when you turn on nearby sync.
        NSCalendarsFullAccessUsageDescription: Still reads the event you are in to suggest a title and the people expected.
        NSBonjourServices:
          - _still-sync._tcp
        UIBackgroundModes:
          - audio
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio or Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.movie
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Still
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still
        CODE_SIGN_ENTITLEMENTS: Still/Still.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "*.fixture.caf *.fixture.mov"
    entitlements:
      path: Still/Still.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.andrii.still
  Still-macOS:
    type: application
    platform: macOS
    dependencies:
      - target: StillBrowserExtension
        embed: true
      - target: StillMCPHelper
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: StillNativeHost
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: FluidAudio
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXGuidedGeneration
      - package: SwiftTransformers
        product: Tokenizers
    sources:
      - path: Still
    settings:
      base:
        PRODUCT_NAME: Still
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Still
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Still uses the microphone to transcribe a meeting on this device.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Still syncs directly with your other devices on this network when you turn on nearby sync.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Still reads the event you are in to suggest a title and the people expected.
        CODE_SIGN_ENTITLEMENTS: Still/Still-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "*.fixture.caf *.fixture.mov"
    entitlements:
      path: Still/Still-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - R3XFQ7K885.com.andrii.still
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.andrii.still
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/Google/Chrome/NativeMessagingHosts/
          - /Library/Application Support/Microsoft Edge/NativeMessagingHosts/
          - /Library/Application Support/BraveSoftware/Brave-Browser/NativeMessagingHosts/
          - /Library/Application Support/Arc/User Data/NativeMessagingHosts/
  StillBrowserExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: StillBrowserExtension
      - path: Still/Automation/BrowserMeetingSignal.swift
    info:
      path: StillBrowserExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.browser
        PRODUCT_NAME: StillBrowserExtension
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: StillBrowserExtension/StillBrowserExtension.entitlements
    entitlements:
      path: StillBrowserExtension/StillBrowserExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
  StillMCPHelper:
    type: tool
    platform: macOS
    sources:
      - path: StillMCPHelper
      - path: Still/MCP/JSONValue.swift
      - path: Still/MCP/MCPSocketLocation.swift
    settings:
      base:
        PRODUCT_NAME: still-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.mcp
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: StillMCPHelper/StillMCPHelper.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: StillMCPHelper/StillMCPHelper.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - R3XFQ7K885.com.andrii.still
  StillNativeHost:
    type: tool
    platform: macOS
    sources:
      - path: StillNativeHost
      - path: Still/Automation/BrowserMeetingSignal.swift
      - path: Still/Automation/NativeMessaging.swift
      - path: Still/Automation/WebBrowser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.native-host
        PRODUCT_NAME: StillNativeHost
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: StillNativeHost/StillNativeHost.entitlements
    entitlements:
      path: StillNativeHost/StillNativeHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
  StillEval:
    type: tool
    platform: macOS
    sources:
      - path: Tools/StillEval
      - path: Still/Evaluation/ErrorRates.swift
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: still-eval
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.eval
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  StillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StillUITests
    dependencies:
      - target: Still-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Still-iOS
        CODE_SIGN_STYLE: Automatic
  StillTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StillTests
    dependencies:
      - target: Still-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrii.still.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Still.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Still"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Still-iOS:
    build:
      targets:
        Still-iOS: all
        StillUITests: [test]
    run:
      storeKitConfiguration: Still/Supporting/Still.storekit
    test:
      targets:
        - StillUITests
  Still-macOS:
    build:
      targets:
        Still-macOS: all
        StillTests: [test]
    run:
      storeKitConfiguration: Still/Supporting/Still.storekit
    test:
      targets:
        - StillTests
