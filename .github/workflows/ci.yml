name: Build and test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"

jobs:
  verify:
    name: bin/check.sh
    runs-on: macos-26

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          if [ ! -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            echo "Xcode ${XCODE_VERSION} is not on this image. Available:" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore the Model Pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Still-E2E/Models
          key: parakeet-tdt-0.6b-v3-7dd20fe6

      - name: Run every check
        run: bin/check.sh

      - name: Upload results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: still-check-results
          path: |
            Artifacts/check.log
            Artifacts/E2E.log
            Artifacts/E2E-screens
          if-no-files-found: warn
          retention-days: 3
